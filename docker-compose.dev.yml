# Development overrides — mounts source code for hot reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    build:
      target: deps
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json
    command: npx tsx watch src/server.ts
    environment:
      NODE_ENV: development

  frontend:
    build:
      target: deps
    volumes:
      - ../collabcode-ui/src:/app/src
      - ../collabcode-ui/public:/app/public
    command: npx next dev
    environment:
      NODE_ENV: development
